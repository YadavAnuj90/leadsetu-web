# Leadsetu CRM — Production Nginx Reverse Proxy (PM2 / Docker host)
# Replace `app.yourdomain.com` with your production domain and run:
#   sudo certbot --nginx -d app.yourdomain.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream leadsetu_web_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream leadsetu_api_upstream {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.yourdomain.com;

    # Certbot ACME HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.yourdomain.com;

    # Managed by Certbot (update paths if using Cloudflare Origin / custom cert)
    ssl_certificate     /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Match NestJS 10 MB payload allowance (PDFs, brochures, certificates)
    client_max_body_size 15M;

    # Basic security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Real-time Socket.IO gateways (/inbox & /calls WebRTC signaling)
    location /socket.io/ {
        proxy_pass http://leadsetu_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Direct NestJS v1 API routes & health endpoint (/v1/health)
    location /v1/ {
        proxy_pass http://leadsetu_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy frontend `/api/*` directly to NestJS `/v1/*` (avoids double Next.js hop)
    location /api/ {
        rewrite ^/api/(.*)$ /v1/$1 break;
        proxy_pass http://leadsetu_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Next.js SSR, static assets & client dashboard
    location / {
        proxy_pass http://leadsetu_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
